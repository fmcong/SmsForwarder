name: Weekly Build

on:
  workflow_dispatch:
    inputs:
      root_sol:
        description: "Weekly Build Title"
        required: true
        default: "SmsForwarder"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      output: "${{ github.workspace }}/build/app/outputs/apk/release"
      ver_suffix_1: 100
      ver_suffix_3: 300
      ver_suffix_5: 500

    steps:
      # 1. 检出代码
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2. 清理旧的工作流运行（保留最近 3 次，保留最近 7 天内的）
      #    如果您不需要自动清理，可删除此步骤
      - name: Delete old workflow runs
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
          delete_workflow_pattern: 'Weekly Build'

      # 3. 设置 JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      # 4. 缓存 Gradle 依赖
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. 检出 Keystore 并复制到项目根目录
      - name: Checkout Android Keystore
        uses: actions/checkout@v5
        with:
          repository: fmcong/keystore
          token: ${{ secrets.TOKEN }}
          path: keystore

      - name: Copy keystore to app folder
        run: |
          if ls keystore/*.jks 1> /dev/null 2>&1; then
            cp keystore/*.jks app/
          elif ls keystore/*.keystore 1> /dev/null 2>&1; then
            cp keystore/*.keystore app/
          else
            echo "No keystore file found in keystore directory"
            exit 1
          fi

      # 6. 构建 Release APK
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease

      # 7. 解析 output-metadata.json 并上传 APK 到 XUpdate
      - name: Parse metadata and upload APKs to XUpdate
        id: upload_xupdate
        run: |
          metadata_file="${{ env.output }}/output-metadata.json"
          if [ ! -f "$metadata_file" ]; then
            echo "Error: output-metadata.json not found!"
            exit 1
          fi

          applicationId=$(jq -r '.applicationId' "$metadata_file")
          buildDate=$(jq -r '.buildDate' "$metadata_file")
          buildTime=$(jq -r '.buildTime' "$metadata_file")
          gitCommitId=$(jq -r '.gitCommitId' "$metadata_file")

          first_apk=$(jq -r '.elements[0].outputFile' "$metadata_file")
          if [[ $first_apk =~ SmsF_([^_]+)_([^_]+)_(.+)_release\.apk ]]; then
            versionName="${BASH_REMATCH[1]}"
            versionCode="${BASH_REMATCH[2]}"
            echo "ver_name=${versionName}" >> $GITHUB_ENV
            echo "ver_code=${versionCode: -3}" >> $GITHUB_ENV
          else
            echo "Error: Cannot parse version from filename: $first_apk"
            exit 1
          fi

          jq -r '.elements[].outputFile' "$metadata_file" | while IFS= read -r apk_file; do
            echo "Processing APK: $apk_file"

            if [[ $apk_file =~ SmsF_([^_]+)_([^_]+)_(.+)_release\.apk ]]; then
              apk_versionName="${BASH_REMATCH[1]}"
              apk_versionCode="${BASH_REMATCH[2]}"
              abi="${BASH_REMATCH[3]}"
            else
              echo "Skipping invalid APK filename: $apk_file"
              continue
            fi

            response=$(curl --retry 3 -X POST -H "Cache-Control: no-cache" \
              -H "Content-Type: application/json" \
              -H "Cookie: xupdate_token=${{ secrets.XUPDATE_TOKEN }}" \
              -H "X-Token: ${{ secrets.X_TOKEN }}" \
              -d "{\"appKey\":\"${applicationId}\",\"versionName\":\"${apk_versionName}\",\"versionCode\":\"${apk_versionCode}\",\"modifyContent\":\"\",\"updateStatus\":1,\"gitCommitId\":\"${gitCommitId}\",\"buildTime\":\"${buildTime}\",\"uploadTime\":\"${buildTime}\"}" \
              ${{ secrets.URL_ADD_VERSION }})

            version_id=$(echo "$response" | jq -r '.versionId')
            if [[ -z "$version_id" || "$version_id" == "null" ]]; then
              echo "Error: Failed to get versionId, response: $response"
              continue
            fi

            echo "Got versionId: $version_id"

            curl --retry 3 -X POST -H "Cache-Control: no-cache" \
              -H "Content-Type: multipart/form-data" \
              -H "Cookie: xupdate_token=${{ secrets.XUPDATE_TOKEN }}" \
              -H "X-Token: ${{ secrets.X_TOKEN }}" \
              -F "file=@${{ env.output }}/${apk_file};filename=${apk_file}" \
              -F "versionId=${version_id}" \
              ${{ secrets.URL_UPLOAD_APK }}

            if [ $? -ne 0 ]; then
              echo "Error uploading APK: $apk_file"
            else
              echo "Successfully uploaded $apk_file"
            fi
          done

      # 8. 上传 APK 为 Artifacts
      - name: Upload universal APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "SmsF_${{ env.ver_name }}_${{ env.ver_suffix_1 }}${{ env.ver_code }}_universal_release.apk"
          path: "${{ env.output }}/SmsF_*_universal_release.apk"
          if-no-files-found: warn

      - name: Upload arm64-v8a APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "SmsF_${{ env.ver_name }}_${{ env.ver_suffix_3 }}${{ env.ver_code }}_arm64-v8a_release.apk"
          path: "${{ env.output }}/SmsF_*_arm64-v8a_release.apk"
          if-no-files-found: warn

      - name: Upload x86_64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "SmsF_${{ env.ver_name }}_${{ env.ver_suffix_5 }}${{ env.ver_code }}_x86_64_release.apk"
          path: "${{ env.output }}/SmsF_*_x86_64_release.apk"
          if-no-files-found: warn
